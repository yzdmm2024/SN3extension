name: build-sn3

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      # Homebrew 新版本强制 tap 信任检查，runner 上预置的 aws/tap 未信任会导致 brew install 直接失败。
      # 关掉该检查以解锁构建（仅影响 CI 安装依赖步骤）。
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz perl || true

      - name: Install Theos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos
          # Download iOS 14.5 SDK for compatibility
          mkdir -p $HOME/theos/sdks
          gh release download -R theos/sdks -p "iPhoneOS14.5.sdk.tar.xz" -D /tmp
          tar -xJf /tmp/iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks/
          # Create symlink for Makefile's TARGET
          ln -sf "$HOME/theos/sdks/iPhoneOS14.5.sdk" "$HOME/theos/sdks/iPhoneOS14.0.sdk"

      - name: Build with Theos
        run: |
          export THEOS=$HOME/theos
          rm -rf .theos
          make
          echo "=== Build output ==="
          find .theos -type f 2>/dev/null | head -50

      # v5.25.2 新增：prefs bundle 必须自包含。
      # 之前 v5.23.0 起的「测试连接」按钮在 prefs bundle 里引用了 AskAIEngine，
      # 而该类只编进 tweak dylib，设置进程里 dlopen 直接报
      #   symbol not found in flat namespace '_OBJC_CLASS_$_AskAIEngine'
      # 导致「设置 → 超级截图」不显示。plist 检查发现不了，只能查二进制。
      - name: "Guard: prefs bundle must be self-contained"
        run: |
          BIN=""
          for c in .theos/obj/debug/Snapper3ZhExtPrefs.bundle/Snapper3ZhExtPrefs \
                   .theos/obj/Snapper3ZhExtPrefs.bundle/Snapper3ZhExtPrefs; do
            [ -f "$c" ] && BIN="$c" && break
          done
          if [ -z "$BIN" ]; then echo "FATAL: 找不到 prefs bundle 可执行文件"; exit 1; fi
          echo "检查: $BIN"
          python3 tools/check_undef_symbols.py "$BIN" src

      - name: Package deb manually
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          mkdir -p stage/DEBIAN

          # ---- TweakInject：dylib + 对应的 Filter plist（必须是 MobileSubstrate 过滤器，不是 PreferenceLoader 条目！）
          mkdir -p stage/var/jb/usr/lib/TweakInject
          cp .theos/obj/debug/Snapper3ZhExt.dylib stage/var/jb/usr/lib/TweakInject/ 2>/dev/null || \
          cp .theos/obj/Snapper3ZhExt.dylib stage/var/jb/usr/lib/TweakInject/ || { echo "FATAL: Snapper3ZhExt.dylib not found"; exit 1; }
          cp layout/Library/MobileSubstrate/DynamicLibraries/Snapper3ZhExt.plist stage/var/jb/usr/lib/TweakInject/

          # ---- PreferenceBundles：先铺 layout（含手写 Info.plist / Root.plist / 图标），
          #      再单独拷贝 theos 产出的可执行文件。
          #      注意：不能整目录覆盖 .theos 的 bundle，否则 theos 自动生成的 Info.plist
          #      会把手写的 NSPrincipalClass 冲掉，面板就没了。
          mkdir -p stage/var/jb/Library/PreferenceBundles
          cp -R layout/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle stage/var/jb/Library/PreferenceBundles/
          cp .theos/obj/debug/Snapper3ZhExtPrefs.bundle/Snapper3ZhExtPrefs stage/var/jb/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle/ 2>/dev/null || \
          cp .theos/obj/Snapper3ZhExtPrefs.bundle/Snapper3ZhExtPrefs stage/var/jb/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle/ || { echo "FATAL: Snapper3ZhExtPrefs executable not found"; exit 1; }

          # ---- ControlCenter：同样先铺 layout 再拷可执行文件
          mkdir -p stage/var/jb/Library/ControlCenter/Bundles
          cp -R layout/Library/ControlCenter/Bundles/SN3CCModule.bundle stage/var/jb/Library/ControlCenter/Bundles/
          cp .theos/obj/debug/SN3CCModule.bundle/SN3CCModule stage/var/jb/Library/ControlCenter/Bundles/SN3CCModule.bundle/ 2>/dev/null || \
          cp .theos/obj/SN3CCModule.bundle/SN3CCModule stage/var/jb/Library/ControlCenter/Bundles/SN3CCModule.bundle/ || { echo "FATAL: SN3CCModule executable not found"; exit 1; }

          # ---- Companion App（v6.17 套壳）：拷贝 theos 产出的 .app
          mkdir -p stage/var/jb/Applications
          APP_PATH=$(find .theos/obj -name "SN3Companion.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then echo "FATAL: SN3Companion.app not found"; exit 1; fi
          cp -R "$APP_PATH" stage/var/jb/Applications/
          # 对 app 可执行文件做假签名（theos 一般已签，这里兜底）
          ldid -S stage/var/jb/Applications/SN3Companion.app/SN3Companion 2>/dev/null || true

          # ---- PreferenceLoader 入口
          mkdir -p stage/var/jb/Library/PreferenceLoader/Preferences
          cp layout/Library/PreferenceLoader/Preferences/Snapper3ZhExt.plist stage/var/jb/Library/PreferenceLoader/Preferences/

          # ---- 自检：三个关键文件缺一不可
          test -f stage/var/jb/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle/Snapper3ZhExtPrefs || { echo "FATAL: prefs executable missing"; exit 1; }
          test -f stage/var/jb/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle/Root.plist || { echo "FATAL: Root.plist missing"; exit 1; }
          test -f stage/var/jb/Library/ControlCenter/Bundles/SN3CCModule.bundle/SN3CCModule || { echo "FATAL: CC executable missing"; exit 1; }
          test -f stage/var/jb/Applications/SN3Companion.app/SN3Companion || { echo "FATAL: companion app executable missing"; exit 1; }
          plutil -extract CFBundleIdentifier raw stage/var/jb/Applications/SN3Companion.app/Info.plist
          plutil -extract NSPrincipalClass raw stage/var/jb/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle/Info.plist

          # ---- 保险：对所有 Mach-O 显式假签名（theos 一般已签，这里兜底）
          find stage -type f \( -name "*.dylib" -o -name "Snapper3ZhExtPrefs" -o -name "SN3CCModule" \) -exec ldid -S {} \;

          # Copy control
          cp control stage/DEBIAN/control
          sed -i '' "s/^Version:.*/Version: $VERSION/" stage/DEBIAN/control
          echo "" >> stage/DEBIAN/control
          chmod 755 stage/DEBIAN/control

          echo "=== Stage layout ==="
          find stage -type f

          mkdir -p packages
          dpkg-deb --root-owner-group -b stage packages/com.axs.snapper3zhext_${VERSION}_iphoneos-arm64.deb
          echo "=== Deb package ==="
          ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SN3extension-deb
          path: packages/*.deb

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb