name: build-sn3

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz perl || true

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos

      - name: Build with Theos
        run: |
          export THEOS=$HOME/theos
          # Override SDK to use Xcode's built-in SDK
          export TARGET="iphone:clang:14.0:latest"
          make clean
          make
          echo "=== Build output ==="
          find .theos -type f 2>/dev/null | head -50

      - name: Package deb manually
        run: |
          VERSION=$(grep '^Version:' control | awk '{print $2}')
          mkdir -p stage/DEBIAN

          # TweakInject
          mkdir -p stage/var/jb/usr/lib/TweakInject
          cp .theos/obj/debug/Snapper3ZhExt.dylib stage/var/jb/usr/lib/TweakInject/ 2>/dev/null || \
          cp .theos/obj/Snapper3ZhExt.dylib stage/var/jb/usr/lib/TweakInject/ 2>/dev/null || true
          cp layout/Library/PreferenceLoader/Preferences/Snapper3ZhExt.plist stage/var/jb/usr/lib/TweakInject/Snapper3ZhExt.plist 2>/dev/null || true

          # PreferenceBundles
          mkdir -p stage/var/jb/Library/PreferenceBundles
          cp -R layout/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle stage/var/jb/Library/PreferenceBundles/ 2>/dev/null || true
          if [ -d ".theos/obj/debug/Snapper3ZhExtPrefs.bundle" ]; then
            cp -R .theos/obj/debug/Snapper3ZhExtPrefs.bundle/* stage/var/jb/Library/PreferenceBundles/Snapper3ZhExtPrefs.bundle/ 2>/dev/null || true
          fi

          # ControlCenter
          mkdir -p stage/var/jb/Library/ControlCenter/Bundles
          cp -R layout/Library/ControlCenter/Bundles/SN3CCModule.bundle stage/var/jb/Library/ControlCenter/Bundles/ 2>/dev/null || true
          if [ -d ".theos/obj/debug/SN3CCModule.bundle" ]; then
            cp -R .theos/obj/debug/SN3CCModule.bundle/* stage/var/jb/Library/ControlCenter/Bundles/SN3CCModule.bundle/ 2>/dev/null || true
          fi

          # PreferenceLoader
          mkdir -p stage/var/jb/Library/PreferenceLoader/Preferences
          cp layout/Library/PreferenceLoader/Preferences/Snapper3ZhExt.plist stage/var/jb/Library/PreferenceLoader/Preferences/ 2>/dev/null || true

          # Copy control
          cp control stage/DEBIAN/control
          sed -i '' "s/^Version:.*/Version: $VERSION/" stage/DEBIAN/control
          echo "" >> stage/DEBIAN/control
          chmod 755 stage/DEBIAN/control

          echo "=== Stage layout ==="
          find stage -type f

          dpkg-deb --root-owner-group -b stage packages/com.axs.snapper3zhext_${VERSION}_iphoneos-arm64.deb
          echo "=== Deb package ==="
          ls -la packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SN3extension-deb
          path: packages/*.deb

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb